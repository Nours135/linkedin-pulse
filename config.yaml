heartbeat_minutes: 30
resume: assets/resume.json
work_dir: work

llm:
  model: claude-haiku-5-5   # any Claude model id
  max_tokens: 16000

search:
  queries:               # one LinkedIn search per query; results are merged and deduped
    - Software Engineer New Grad
    - Backend Engineer
    - Machine Learning Engineer
  location: United States
  posted_within_hours: 120  # LinkedIn-side window; keep it >= filter.max_age_days * 24
  max_jobs: 25           # per query

filter:                  # applied by the job agent before any JD fetch or LLM call
  max_age_days: 5        # drop jobs posted more than this many days ago

match:
  min_keyword_hits: 3    # keyword pre-filter on the JD, before any LLM call
  min_score: 70          # skip resume/email below this score

retry:
  max_attempts: 3        # a job that errored is retried on later heartbeats up to this many times

email:
  dry_run: true          # write work/outbox/<job_id>.eml instead of sending
