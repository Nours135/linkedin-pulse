# Example config, committed. Copy it to config.yaml (gitignored) and list your own candidates;
# pulse reads config.yaml and falls back to this file only when config.yaml is missing.
heartbeat_minutes: 30
work_dir: work           # each candidate's jobs, keywords, outbox and resumes go in work/<name>/

candidates:              # one entry per person; each has their own profile, inbox and job history
  john-wang:
    profile: assets/candidates/john-wang   # resume.json + components/<key>.tex
    email_to: john.wang@example.com        # falls back to EMAIL_TO, then SMTP_USER
    # queries: ["Backend Engineer"]        # optional; default: generated from the resume

llm:
  model: claude-haiku-5-5   # any Claude model id
  max_tokens: 16000

search:
  locations: [United States]  # each query is searched once per location; the whole US by default
  posted_within_hours: 120  # LinkedIn-side window; keep it >= filter.max_age_days * 24
  max_jobs: 1000         # per query and location; 1000 is the guest API's limit. Paging stops earlier once
                         # a whole page was seen before, so steady heartbeats fetch only a page or two

filter:                  # applied by the job agent before any JD fetch or LLM call
  max_age_days: 5        # drop jobs posted more than this many days ago

match:
  min_keyword_hits: 3    # keyword pre-filter on the JD, before any LLM call
  min_score: 70          # skip resume/email below this score
  tags:                  # filter on the tags Claude assigns while scoring; a candidate's own `tags` overrides each key
    # job type: <yy>NG, <yy>Summer, <yy>Intern (yy = target year, omitted if unstated), PartTime
    # work authorization: CitizenOnly, NoSponsor
    include: []          # keep only jobs with a tag matching one of these, e.g. ["27NG", "*Summer"]; empty keeps all
    exclude: []          # drop jobs with a tag matching any of these, e.g. ["CitizenOnly", "NoSponsor"]

retry:
  max_attempts: 3        # a job that errored is retried on later heartbeats up to this many times

email:
  dry_run: true          # write work/<candidate>/outbox/<job_id>.eml instead of sending
